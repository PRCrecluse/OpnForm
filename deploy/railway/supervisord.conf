[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/null
user=root

[program:php-fpm]
command=php-fpm -F
user=www-data
priority=10
stopsignal=QUIT
stopwaitsecs=25
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
user=www-data
priority=20
stopsignal=QUIT
stopwaitsecs=25
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:worker]
command=php /app/artisan queue:work redis --sleep=1 --tries=3 --timeout=3610 --max-time=3600 --memory=384 --no-interaction
user=www-data
priority=30
stopsignal=TERM
stopwaitsecs=25
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /opt/opnform/scheduler.php
user=www-data
priority=30
stopsignal=TERM
stopwaitsecs=25
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
